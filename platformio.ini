# Reference:
#https://github.com/pioarduino/platform-espressif32/blob/develop/examples/espidf-arduino-blink/platformio.ini

[platformio]
src_dir = main

[env]

platform = https://github.com/pioarduino/platform-espressif32.git#develop
#platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
#platform = espressif32
#framework = arduino, espidf
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
; Copied this partition table from ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/default_16MB.csv
board_build.partitions = partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 16777216

; Fix missing ELF SHA256 in firmware image: PlatformIO’s build doesnt embed the ELF‐file SHA256,
; causing espcoredump.py to reject core dumps.
extra_scripts = pre:inject_sha.py